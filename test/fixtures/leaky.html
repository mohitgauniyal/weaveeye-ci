<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Leaky Test Site</title>
</head>
<body>
  <h1>Leaky test fixture</h1>
  <p>This page fires an advertising request before consent — used to prove the
     gate flags a pre-consent data transfer.</p>

  <script>
    // Fire a request to a known advertising domain BEFORE consent. The scanner
    // detects the request as it is initiated, so it counts even if it fails.
    new Image().src = "https://securepubads.g.doubleclick.net/gampad/ads?fixture=" + Date.now();
  </script>

  <!-- An OneTrust-style consent banner the scanner can detect and accept. -->
  <div id="onetrust-banner-sdk" style="position:fixed;bottom:0;left:0;right:0;padding:16px;background:#eee">
    We use cookies.
    <button id="onetrust-accept-btn-handler"
            onclick="document.getElementById('onetrust-banner-sdk').remove()">
      Accept All
    </button>
  </div>
</body>
</html>
